<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
<title>happy_toad agent</title>
<style>
:root {
  --canvas: #ffffff; --ink: #000000; --muted: #6f7171; --line: #d8dada;
  --accent: #ee001e; --chip: #f8f3e9; --ok: #00873e; --soft: #f6f6f6;
  --radius: 16px;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--canvas); }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { height: 4px; background: var(--accent); }
header { max-width: 880px; margin: 0 auto; padding: 22px 16px 0; display: flex; flex-wrap: wrap;
  align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.brand { flex: 1 1 320px; min-width: 0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 46ch; }
.status { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

main { max-width: 880px; margin: 0 auto; padding: 20px 16px 56px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--canvas); }

.composer { padding: 14px 14px 12px; }
.composer:focus-within { border-color: var(--ink); }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; border: 0; outline: none;
  font: 16px/1.5 var(--sans); color: var(--ink); background: transparent; padding: 2px; }
.composer textarea::placeholder { color: var(--muted); }
.composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.spacer { flex: 1; }
.counter { font: 12px var(--mono); color: var(--muted); }
.counter.full { color: var(--accent); }

button { font: inherit; cursor: pointer; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; font-weight: 500; }
.chip:hover { border-color: var(--line); }
.chip.on { background: var(--ink); color: var(--canvas); }
.ask { border: 0; background: var(--ink); color: var(--canvas); border-radius: 999px; padding: 8px 22px;
  font-weight: 600; }
.ask:disabled { background: var(--muted); cursor: default; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
.error { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.result { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.question { color: var(--muted); font-size: 14px; margin: 0 2px; }
.question strong { color: var(--ink); font-weight: 600; }

.answer { padding: 22px 22px 18px; }
.answer-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.answer-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); }
.badge.bad { color: var(--accent); }
.badge.neutral { color: var(--ink); }
.warning { border: 1px solid var(--accent); border-left-width: 4px; border-radius: 12px;
  padding: 12px 16px; font-size: 14px; background: #fff5f6; }
.warning strong { color: var(--accent); }
.answer.unchecked { background: var(--soft); }
.answer.unchecked .summary, .answer.unchecked .num .v, .answer.unchecked h2 { color: var(--muted); }
.answer.unchecked .num { background: var(--canvas); }
.unmatched { color: var(--accent); font: 13px var(--mono); margin: -4px 0 6px; }
.badge-note { color: var(--muted); font-size: 13px; }
.summary { white-space: pre-wrap; font-size: 16px; line-height: 1.6; margin: 14px 0 0; max-width: 72ch; }
.note { margin: 12px 0 0; font-size: 13px; color: var(--muted); border-left: 2px solid var(--accent);
  padding-left: 10px; }

.numbers { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
.numbers h3, .section h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.checks-line { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.num { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.num .k { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.num .v { font: 600 18px/1.3 var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.num .r { font: 11px var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
ul.mismatch { color: var(--accent); margin: 10px 0 0; padding-left: 18px; font-size: 13px; }

.section { padding: 18px 22px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td { font-family: var(--mono); }
tr:last-child td { border-bottom: 0; }

details.trace { overflow: hidden; }
details.trace summary { list-style: none; cursor: pointer; padding: 16px 22px; display: flex;
  align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
details.trace summary::-webkit-details-marker { display: none; }
details.trace summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink); transform: rotate(-45deg); transition: transform .15s; }
details.trace[open] summary::before { transform: rotate(45deg); }
.count { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
ol.steps { list-style: none; margin: 0; padding: 0 22px 18px; border-top: 1px solid var(--line); }
ol.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--line); font: 13px/1.5 var(--mono); }
ol.steps li:last-child { border-bottom: 0; }
.step-n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.step-tool { font-weight: 700; }
.step-args { color: var(--muted); overflow-wrap: anywhere; }
.step-out { overflow-wrap: anywhere; }
.step-new { animation: arrive .25s ease-out; }
@keyframes arrive { from { background: var(--chip); } }

.loading .bar { height: 12px; border-radius: 6px; margin-top: 12px;
  background: linear-gradient(90deg, var(--soft) 25%, #ececec 50%, var(--soft) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.loading .bar:nth-child(3) { width: 80%; }
.loading .bar:nth-child(4) { width: 55%; }
@keyframes shimmer { to { background-position: -200% 0; } }

footer.meta { color: var(--muted); font-size: 12px; margin: 2px 2px 0; overflow-wrap: anywhere; }
footer.meta span + span::before { content: " | "; color: var(--line); }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
@media (max-width: 560px) {
  .answer, .section { padding: 16px; }
  details.trace summary { padding: 14px 16px; }
  ol.steps { padding: 0 16px 14px; }
}
</style>
</head>
<body>
<div class="topbar"></div>
<header>
  <div class="brand">
    <h1>happy_toad agent</h1>
    <p>Ask about budget scenarios. A checker traces every number in the answer to a stored run.
      All data is synthetic.</p>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text"></span></div>
</header>
<main>
  <div id="controls"></div>
  <div id="view"></div>
</main>
<script id="boot" type="application/json">__BOOT__</script>
<script>
"use strict";
const boot = JSON.parse(document.getElementById("boot").textContent);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node[k] = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

function fmt(v) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "number" && !Number.isInteger(v)) return String(Math.round(v * 100) / 100);
  return String(v);
}

const label = name => name.replaceAll("_", " ");

function stepItem(s, n, fresh) {
  return el("li", { class: fresh ? "step-new" : "" }, el("span", { class: "step-n" }, String(n)),
    el("div", {}, el("span", { class: "step-tool" }, s.tool), " ", el("span", { class: "step-args" }, s.args),
      el("div", { class: "step-out" }, "↳ ", s.outcome)));
}

function trace(open) {
  const list = el("ol", { class: "steps" });
  const count = el("span", { class: "count" });
  const box = el("details", { class: "card trace" },
    el("summary", {}, "Execution trace", count), list);
  box.open = open;
  const add = (s, fresh) => {
    list.append(stepItem(s, list.children.length + 1, fresh));
    const n = list.children.length;
    count.textContent = `${n} tool call${n === 1 ? "" : "s"}`;
  };
  return { box, add };
}

function table(headers, rows) {
  return el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, ...headers.map(h => el("th", {}, h)))),
    el("tbody", {}, ...rows.map(r => el("tr", {}, ...r.map(c => el("td", {}, fmt(c))))))));
}

const BADGE = { "CHECKED": "ok", "NOT CHECKED": "bad", "NO NUMBERS TO CHECK": "neutral" };

function warning(v) {
  if (v.status === null)
    return el("div", { class: "warning", role: "alert" }, el("strong", {}, "No answer. "), v.detail);
  if (v.status === "NOT CHECKED")
    return el("div", { class: "warning", role: "alert" }, el("strong", {}, "NOT CHECKED. "),
      "The numbers in this answer did not all match the stored runs. Do not rely on them.");
  return null;
}

function checksBlock(v) {
  const c = v.checks;
  const box = el("div", { class: "numbers" }, el("h3", {}, "Claims"));
  if (c.unmatched_numbers.length)
    box.append(el("p", { class: "unmatched" }, "Unmatched numbers: " + c.unmatched_numbers.join(", ")));
  box.append(el("p", { class: "checks-line" }, c.line));
  if (v.claims.length)
    box.append(el("div", { class: "grid" }, ...v.claims.map(x => el("div", { class: "num" },
      el("div", { class: "k" }, label(x.metric)), el("div", { class: "v" }, fmt(x.value)),
      el("div", { class: "r" }, x.run_id_b ? `${x.run_id} → ${x.run_id_b}` : x.run_id)))));
  if (c.mismatches.length)
    box.append(el("ul", { class: "mismatch" }, ...c.mismatches.map(m => el("li", {}, m))));
  return box;
}

function answerCard(v) {
  if (v.status === null) return null;
  const card = el("section", { class: "card answer" + (v.status === "NOT CHECKED" ? " unchecked" : "") },
    el("div", { class: "answer-head" }, el("h2", {}, "Answer"),
      el("span", { class: "badge " + BADGE[v.status] }, v.status)),
    v.summary ? el("p", { class: "summary" }, v.summary) : null,
    v.correction.note ? el("p", { class: "note" }, v.correction.note) : null);
  if (v.checks) card.append(checksBlock(v));
  return card;
}

function runsCard(v) {
  if (!v.runs.length) return null;
  const keys = [...new Set(v.runs.flatMap(r => Object.keys(r.values)))];
  return el("section", { class: "card section" }, el("h3", {}, "Stored runs"),
    table(["run", "version", "outcome", ...keys.map(label)],
      v.runs.map(r => [r.run_id, r.input_version, r.outcome, ...keys.map(k => r.values[k])])));
}

function footer(v) {
  const f = v.footer;
  const cost = f.cost === null ? "cost not reported" : "$" + f.cost.toFixed(4);
  return el("footer", { class: "meta" }, ...[f.model, f.provider, `${f.turns} turns`, cost,
    `${f.seconds} s`, `transcript ${v.transcript_id}`].map(t => el("span", {}, t)));
}

function questionLine(q) {
  return el("p", { class: "question" }, "Question: ", el("strong", {}, q));
}

function renderView(v, liveTrace) {
  const t = liveTrace || trace(false);
  if (!liveTrace) v.steps.forEach(s => t.add(s, false));
  t.box.open = false;
  return el("div", { class: "result" }, questionLine(v.question), warning(v), answerCard(v), runsCard(v), t.box, footer(v));
}

function show(node) { document.getElementById("view").replaceChildren(node); }
function setStatus(text, live) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("dot").classList.toggle("live", !!live);
}

function startReplay() {
  setStatus("Replay of real runs on synthetic data, not a live demo.");
  const chips = boot.views.map((v, i) => el("button", { class: "chip", onclick: () => pick(i) }, boot.labels[i]));
  document.getElementById("controls").append(el("div", { class: "chips" }, ...chips));
  function pick(i) {
    chips.forEach((b, j) => b.classList.toggle("on", i === j));
    show(renderView(boot.views[i]));
  }
  pick(0);
}

function startLive() {
  setStatus("Local demo, uses a live model on synthetic data.");
  const max = boot.max_chars;
  const box = el("textarea", { maxlength: String(max), "aria-label": "Question",
    placeholder: "Ask about a budget scenario, for example: compare budgets 800 and 1500 on v1" });
  const counter = el("span", { class: "counter" }, `0/${max}`);
  const hint = el("p", { class: "hint" }, "One question at a time. Ctrl or Cmd + Enter to ask.");
  const ask = el("button", { class: "ask", onclick: () => send(box.value) }, "Ask");
  const sync = () => {
    counter.textContent = `${box.value.length}/${max}`;
    counter.classList.toggle("full", box.value.length >= max);
  };
  box.oninput = sync;
  box.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(box.value); };
  const examples = Object.entries(boot.examples).map(([key, q]) =>
    el("button", { class: "chip", title: q, onclick: () => { box.value = q; sync(); box.focus(); } }, "Example " + key));
  document.getElementById("controls").append(el("div", { class: "card composer" }, box,
    el("div", { class: "composer-row" }, ...examples, el("span", { class: "spacer" }), counter, ask)), hint);

  async function send(question) {
    if (!question.trim() || ask.disabled) return;
    ask.disabled = true; ask.textContent = "Running";
    hint.className = "hint"; hint.textContent = "The agent is running scenarios. Steps appear as they happen.";
    setStatus("Running on a live model", true);
    const t = trace(true);
    const pending = el("section", { class: "card answer loading", "aria-busy": "true" },
      el("div", { class: "answer-head" }, el("h2", {}, "Answer"), el("span", { class: "badge-note" }, "Working...")),
      el("div", { class: "bar" }), el("div", { class: "bar" }), el("div", { class: "bar" }));
    show(el("div", { class: "result" }, questionLine(question), pending, t.box));
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }) });
      if (!res.ok) { fail((await res.json()).error); show(el("div")); return; }
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
          if (msg.type === "step") t.add(msg.step, true);
          if (msg.type === "view") { show(renderView(msg.view, t)); hint.textContent = "Done. Open the execution trace for each tool call."; }
          if (msg.type === "error") fail(msg.error);
        }
      }
    } catch (err) {
      fail("The request failed: " + err.message + ". Check that the local server is still running.");
    } finally {
      ask.disabled = false; ask.textContent = "Ask";
      setStatus("Local demo, uses a live model on synthetic data.");
    }
  }
  function fail(message) { hint.className = "hint error"; hint.textContent = message; }
}

boot.mode === "replay" ? startReplay() : startLive();
</script>
</body>
</html>
